summary: Create or update a secret (system admin)
description: |
  Stores the value encrypted under the given name. The code reads it with AppSecretsService.get(name) on each
  use, so a new value applies at once, without a redeploy. Omit the value to change only the description.
parameters:
  - $ref: ../../../../components/parameters/pathSecretKey.yml
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: ../../../../components/schemas/admin/secret/put.yml
responses:
  '200':
    content:
      application/json:
        schema:
          $ref: ../../../../components/schemas/admin/secret/model.yml
