summary: Set a job's schedule (system admin)
description: |
  Saves the cron expression, timezone and enabled flag. Enabling creates the Cloud Scheduler job in this environment,
  disabling deletes it. Nothing runs while a job is disabled.
parameters:
  - $ref: ../../../../components/parameters/pathScheduleName.yml
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: ../../../../components/schemas/admin/schedule/put.yml
responses:
  '200':
    content:
      application/json:
        schema:
          $ref: ../../../../components/schemas/admin/schedule/model.yml
