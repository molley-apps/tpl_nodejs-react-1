allOf:
  - $ref: ./baseAttributes.yml
  - type: object
    required:
      - key
      - valueLast4
      - updatedAt
    properties:
      key:
        type: string
        description: The secret's name, as the code reads it with AppSecretsService.get
      valueLast4:
        type: string
        description: The only part of the value ever returned; empty for a short value
      updatedAt:
        type: string
        format: date-time
