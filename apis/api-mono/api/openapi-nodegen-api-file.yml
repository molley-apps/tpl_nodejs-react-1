openapi: 3.0.0
info:
  version: 1.0.0
  title: api-mono
servers:
  - url: /api
    description: API endpoints (all routes prefixed with /api)
paths:
  /admin/schedules:
    get:
      tags:
        - Admin
      summary: Get schedules, from admin
      description: One row per job registered in the code (src/jobs), with the administrator-owned schedule, the last run and the next run.
      operationId: adminSchedulesGet
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSchedules'
          description: OK
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '406':
          description: Not Acceptable
      x-passRequest: true
      x-permission: apiAdminSchedulesRead
  /admin/schedules/{name}:
    put:
      tags:
        - Admin
      summary: Update a schedules based on {name}, from admin
      description: |
        Saves the cron expression, timezone and enabled flag. Enabling creates the Cloud Scheduler job in this environment,
        disabling deletes it. Nothing runs while a job is disabled.
      operationId: adminSchedulesNamePut
      parameters:
        - $ref: '#/components/parameters/PathScheduleName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminSchedulePut'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSchedule'
          description: OK
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '406':
          description: Not Acceptable
      x-passRequest: true
      x-permission: apiAdminSchedulesNameUpdate
  /admin/schedules/{name}/run:
    post:
      tags:
        - Admin
      summary: Create a run, from schedules {name}, from admin
      description: Executes the job immediately in this request, whether or not it is enabled, and returns the recorded run. Skipped when the job is already running.
      operationId: adminSchedulesNameRunPost
      parameters:
        - $ref: '#/components/parameters/PathScheduleName'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSchedule'
          description: OK
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '406':
          description: Not Acceptable
        '422':
          description: Not Acceptable
      x-passRequest: true
      x-permission: apiAdminSchedulesNameRunCreate
  /admin/settings/email:
    delete:
      tags:
        - Admin
      summary: Delete a email, from settings, from admin
      description: Clears the provider and secret. The app runs without outgoing email until new settings are saved and verified.
      operationId: adminSettingsEmailDelete
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericDeleteSuccess'
          description: OK
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '406':
          description: Not Acceptable
      x-passRequest: true
      x-permission: apiAdminSettingsEmailDelete
    get:
      tags:
        - Admin
      summary: Get email, from settings, from admin
      description: The configured provider without its secret, plus whether it is configured and verified by a test send.
      operationId: adminSettingsEmailGet
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSettingsEmail'
          description: OK
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '406':
          description: Not Acceptable
      x-passRequest: true
      x-permission: apiAdminSettingsEmailRead
    put:
      tags:
        - Admin
      summary: Update a email, from settings, from admin
      description: |
        Stores the provider, encrypted secret and from address. Omit the password to keep the stored one.
        Saving resets verification: send a test email afterwards to switch sending on.
      operationId: adminSettingsEmailPut
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminSettingsEmailPut'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSettingsEmail'
          description: OK
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '406':
          description: Not Acceptable
      x-passRequest: true
      x-permission: apiAdminSettingsEmailUpdate
  /admin/settings/email/test:
    post:
      tags:
        - Admin
      summary: Create a test, from email, from settings, from admin
      description: |
        Sends the test template through the saved settings to the caller's own address. A success marks the settings
        verified and switches outgoing email on; a failure returns the provider's response verbatim.
      operationId: adminSettingsEmailTestPost
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSettingsEmailTest'
          description: OK
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '406':
          description: Not Acceptable
        '422':
          description: Not Acceptable
      x-passRequest: true
      x-permission: apiAdminSettingsEmailTestCreate
  /admin/users:
    get:
      tags:
        - Admin
      summary: Get users, from admin
      description: Everyone with an account, newest first. Search matches email and name; role filters on a system role.
      operationId: adminUsersGet
      parameters:
        - $ref: '#/components/parameters/QueryOffset'
        - $ref: '#/components/parameters/QueryLimit'
        - $ref: '#/components/parameters/QuerySearch'
        - $ref: '#/components/parameters/QueryRole'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Users'
          description: OK
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '406':
          description: Not Acceptable
      x-passRequest: true
      x-permission: apiAdminUsersRead
  /admin/users/{userId}:
    delete:
      tags:
        - Admin
      summary: Delete a users based on {userId}, from admin
      description: Removes the account, its credentials and every session. A system admin cannot delete their own account.
      operationId: adminUsersUserIdDelete
      parameters:
        - $ref: '#/components/parameters/PathUserId'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericDeleteSuccess'
          description: OK
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '406':
          description: Not Acceptable
      x-passRequest: true
      x-permission: apiAdminUsersUserIdDelete
  /admin/users/{userId}/roles:
    put:
      tags:
        - Admin
      summary: Update a roles, from users {userId}, from admin
      description: Replaces the user's system roles. A system admin cannot remove their own SUPER_ADMIN role.
      operationId: adminUsersUserIdRolesPut
      parameters:
        - $ref: '#/components/parameters/PathUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUsersRolesPut'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: OK
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '406':
          description: Not Acceptable
      x-passRequest: true
      x-permission: apiAdminUsersUserIdRolesUpdate
  /admin/users/{userId}/sessions:
    delete:
      tags:
        - Admin
      summary: Delete a sessions, from users {userId}, from admin
      description: Deletes every session of the user, so each of their devices must sign in again.
      operationId: adminUsersUserIdSessionsDelete
      parameters:
        - $ref: '#/components/parameters/PathUserId'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericDeleteSuccess'
          description: OK
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '406':
          description: Not Acceptable
      x-passRequest: true
      x-permission: apiAdminUsersUserIdSessionsDelete
    get:
      tags:
        - Admin
      summary: Get sessions, from users {userId}, from admin
      operationId: adminUsersUserIdSessionsGet
      parameters:
        - $ref: '#/components/parameters/PathUserId'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSessions'
          description: OK
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '406':
          description: Not Acceptable
      x-passRequest: true
      x-permission: apiAdminUsersUserIdSessionsRead
  /capabilities:
    get:
      tags:
        - Capabilities
      summary: Get capabilities
      description: Public. The users app reads it before showing flows that depend on them, eg password reset needs email.
      operationId: capabilitiesGet
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
          description: OK
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '406':
          description: Not Acceptable
      x-passRequest: true
      x-permission: apiCapabilitiesRead
  /health:
    get:
      tags:
        - Health
      summary: Get health
      operationId: healthGet
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: OK
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '406':
          description: Not Acceptable
  /internal/jobs/{name}:
    post:
      tags:
        - Internal
      summary: Create a jobs based on {name}, from internal
      description: |
        Called by Cloud Scheduler with an OIDC token for this environment's invoker service account; anything else is 401.
        Runs the job once (a concurrent or retried call is skipped) and answers 200 even when the job itself failed, so
        Scheduler does not retry an application failure.
      operationId: internalJobsNamePost
      parameters:
        - $ref: '#/components/parameters/PathScheduleName'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalJobsRun'
          description: OK
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '406':
          description: Not Acceptable
        '422':
          description: Not Acceptable
      x-passRequest: true
      x-permission: apiInternalJobsNameCreate
  /setup/admin:
    post:
      tags:
        - Setup
      summary: Create a admin, from setup
      description: |
        Grants SUPER_ADMIN to the signed-in user when the key matches the environment's setup key and no administrator
        exists yet. Refused with 409 once there is one and 403 for a wrong key, so the key is useless after the claim.
      operationId: setupAdminPost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupAdminPost'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: OK
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '406':
          description: Not Acceptable
        '422':
          description: Not Acceptable
      x-passRequest: true
      x-permission: apiSetupAdminCreate
  /user/current:
    get:
      tags:
        - User
      summary: Get current, from user
      operationId: userCurrentGet
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: OK
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '406':
          description: Not Acceptable
      x-passRequest: true
      x-permission: apiUserCurrentRead
    put:
      tags:
        - User
      summary: Update a current, from user
      operationId: userCurrentPut
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPut'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: OK
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '406':
          description: Not Acceptable
      x-passRequest: true
      x-permission: apiUserCurrentUpdate
components:
  parameters:
    PathId:
      in: path
      name: id
      schema:
        type: string
      required: true
      description: ID of object to fetch
    PathRoleName:
      in: path
      name: roleName
      schema:
        type: string
      required: true
      description: Name of the role
    PathScheduleName:
      in: path
      name: name
      schema:
        type: string
        pattern: ^[a-z][a-z0-9-]{2,40}$
      required: true
      description: The job name as registered in src/jobs
    PathUserId:
      in: path
      name: userId
      schema:
        type: string
      required: true
      description: ID of the user
    QueryCreatedAtFrom:
      in: query
      name: createdAtFrom
      required: false
      schema:
        type: string
        format: date-time
      description: Filter results created on or after this date
      example: '2024-01-01T00:00:00Z'
    QueryCreatedAtTo:
      in: query
      name: createdAtTo
      required: false
      schema:
        type: string
        format: date-time
      description: Filter results created on or before this date
      example: '2024-12-31T23:59:59Z'
    QueryDateFrom:
      in: query
      name: dateFrom
      required: true
      schema:
        type: string
        format: date-time
      description: date from
    QueryDateTo:
      in: query
      name: dateTo
      required: true
      schema:
        type: string
        format: date-time
      description: date to
    QueryEmail:
      in: query
      name: email
      required: true
      schema:
        type: string
        minLength: 2
      description: Email search term (minimum 2 characters)
      example: john@
    QueryEndDate:
      name: endDate
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: Filter logs until this date
    QueryLimit:
      in: query
      name: limit
      required: false
      schema:
        type: integer
        default: 25
        minimum: 0
        maximum: 100
      description: Max number of results returned
    QueryOffset:
      in: query
      name: offset
      required: false
      schema:
        type: integer
        minimum: 0
      description: The number of items to skip before starting to collect the result set
    QueryRole:
      name: role
      in: query
      required: false
      schema:
        type: string
      description: Filter by role name
    QuerySearch:
      in: query
      name: search
      required: false
      schema:
        type: string
      description: Search term
      example: John
    QueryStartDate:
      name: startDate
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: Filter logs from this date
    QueryStatus:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum:
          - active
          - inactive
      description: Filter by member status
    QueryUpdatedAtFrom:
      in: query
      name: updatedAtFrom
      required: false
      schema:
        type: string
        format: date-time
      description: Filter results updated on or after this date
      example: '2024-01-01T00:00:00Z'
    QueryUpdatedAtTo:
      in: query
      name: updatedAtTo
      required: false
      schema:
        type: string
        format: date-time
      description: Filter results updated on or before this date
      example: '2024-12-31T23:59:59Z'
    QueryUserId:
      in: query
      name: userId
      schema:
        type: string
      required: false
      description: Filter apps based on user's access permissions (role, location, etc.)
  schemas:
    AdminScheduleBaseAttributes:
      type: object
      properties:
        cron:
          type: string
          maxLength: 100
          description: Five-field cron expression, eg "15 3 * * *"
        timezone:
          type: string
          maxLength: 64
          description: IANA timezone name the cron is read in, eg Europe/London
        enabled:
          type: boolean
          description: Creates a Cloud Scheduler job in this environment while true. Nothing runs while false.
    AdminSchedule:
      allOf:
        - $ref: '#/components/schemas/AdminScheduleBaseAttributes'
        - type: object
          required:
            - name
            - description
            - defaultCron
            - defaultTimezone
            - orphaned
            - running
          properties:
            name:
              type: string
            description:
              type: string
            defaultCron:
              type: string
              description: The schedule the code suggests; Reset to default returns to it
            defaultTimezone:
              type: string
            orphaned:
              type: boolean
              description: The code no longer registers this job; kept for its history, cannot be enabled
            running:
              type: boolean
            schedulerJobName:
              type: string
              description: Full Cloud Scheduler job name while enabled in a deployed environment
            lastRun:
              $ref: '#/components/schemas/AdminScheduleRun'
            nextRunAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    AdminSchedules:
      type: array
      items:
        $ref: '#/components/schemas/AdminSchedule'
    AdminSchedulePut:
      allOf:
        - $ref: '#/components/schemas/AdminScheduleBaseAttributes'
        - type: object
          required:
            - cron
            - timezone
            - enabled
    AdminScheduleRun:
      type: object
      required:
        - startedAt
        - finishedAt
        - status
        - durationMs
        - by
      properties:
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/AdminScheduleRunStatusEnum'
        durationMs:
          type: integer
        by:
          type: string
          description: scheduler, local-timer or admin:<userId>
        error:
          type: string
        result:
          type: object
          description: What the handler returned, a small JSON object
    AdminScheduleRunStatusEnum:
      type: string
      enum:
        - success
        - failed
        - timed-out
    AdminSession:
      type: object
      description: A Better Auth session document, as stored in the sessions collection. The token is never returned.
      required:
        - _id
        - userId
        - createdAt
        - updatedAt
        - expiresAt
      properties:
        _id:
          type: string
        userId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        ipAddress:
          type: string
        userAgent:
          type: string
    AdminSessions:
      type: array
      items:
        $ref: '#/components/schemas/AdminSession'
    AdminSettingsEmailBaseAttributes:
      type: object
      properties:
        provider:
          $ref: '#/components/schemas/AdminSettingsEmailProviderEnum'
        host:
          type: string
          maxLength: 255
          description: SMTP host
        port:
          type: integer
          minimum: 1
          maximum: 65535
        secure:
          type: boolean
          description: Implicit TLS (port 465). Otherwise STARTTLS is required.
        username:
          type: string
          maxLength: 255
        fromAddress:
          type: string
          format: email
          description: Must be on a domain verified at the provider, or nothing arrives
        fromName:
          type: string
          maxLength: 100
          description: Defaults to the app name
        replyTo:
          type: string
          format: email
    AdminSettingsEmail:
      allOf:
        - $ref: '#/components/schemas/AdminSettingsEmailBaseAttributes'
        - type: object
          required:
            - configured
            - verified
          properties:
            configured:
              type: boolean
              description: Settings are saved
            verified:
              type: boolean
              description: A test email went through since the last save, so the app sends real email
            passwordLast4:
              type: string
              description: The only part of the secret ever returned
            verifiedAt:
              type: string
              format: date-time
            lastSendAt:
              type: string
              format: date-time
            lastError:
              type: string
              description: The provider's last failure, cleared by the next successful send
            updatedAt:
              type: string
              format: date-time
    AdminSettingsEmailProviderEnum:
      type: string
      description: A preset the admin app fills host, port and username from, or smtp for any other server.
      enum:
        - resend
        - brevo
        - sendgrid
        - mailgun
        - smtp
    AdminSettingsEmailPut:
      allOf:
        - $ref: '#/components/schemas/AdminSettingsEmailBaseAttributes'
        - type: object
          required:
            - provider
            - host
            - port
            - username
            - fromAddress
          properties:
            password:
              type: string
              maxLength: 1024
              description: The provider's SMTP password or API key. Required on first save, omit later to keep the stored one.
    AdminSettingsEmailTest:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
        providerResponse:
          type: string
          description: The SMTP server's reply, verbatim, for both outcomes
    AdminUsersRolesPut:
      type: object
      required:
        - roles
      properties:
        roles:
          type: array
          description: The system roles the user should hold. Empty makes them a standard user.
          items:
            type: string
            enum:
              - SUPER_ADMIN
    Capabilities:
      type: object
      required:
        - email
      properties:
        email:
          type: boolean
          description: Outgoing email is configured and verified, so password reset and magic links work
    GenericDeleteSuccess:
      type: object
      properties:
        success:
          type: boolean
          default: true
    GenericSearchMeta:
      type: object
      properties:
        totalResultCount:
          type: number
        offset:
          type: number
        limit:
          type: number
    Health:
      type: object
      properties:
        http:
          type: boolean
    InternalJobsRun:
      type: object
      required:
        - skipped
      properties:
        skipped:
          type: boolean
          description: True when the job was disabled, unknown or already running, so nothing ran
        status:
          $ref: '#/components/schemas/AdminScheduleRunStatusEnum'
        durationMs:
          type: integer
    SetupAdminPost:
      type: object
      required:
        - key
      properties:
        key:
          type: string
          minLength: 16
          maxLength: 200
          description: The environment's one-time setup key (ADMIN_SETUP_KEY), handed to the owner by Molley
    UserAutocomplete:
      type: object
      required:
        - _id
        - email
      properties:
        _id:
          type: string
          description: User ID
        email:
          type: string
          format: email
          description: User's email address
        firstName:
          type: string
          description: User's first name
        lastName:
          type: string
          description: User's last name
        displayName:
          type: string
          description: Full display name
    UserAutocompletes:
      type: array
      items:
        $ref: '#/components/schemas/UserAutocomplete'
    UserBaseAttributes:
      type: object
      required:
        - firstName
        - lastName
      properties:
        firstName:
          type: string
          maxLength: 100
          description: User's first name
        lastName:
          type: string
          maxLength: 100
          description: User's last name
        name:
          type: string
          maxLength: 200
          description: Display name shown in the UI, defaults to "firstName lastName" at sign up
        image:
          type: string
          maxLength: 2048
          description: Avatar image URL
    UserDisplayName:
      type: object
      required:
        - _id
        - displayName
      properties:
        _id:
          type: string
          format: uuid
          description: User ID
        displayName:
          type: string
          description: User's display name (firstName + lastName or email fallback)
    UserDisplayNames:
      type: array
      items:
        $ref: '#/components/schemas/UserDisplayName'
    UserDisplayNamePost:
      type: object
      required:
        - userIds
      properties:
        userIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          maxItems: 100
          description: Array of user IDs to fetch display names for
    User:
      allOf:
        - $ref: '#/components/schemas/UserBaseAttributes'
        - type: object
          required:
            - _id
            - email
            - emailVerified
            - roles
            - createdAt
            - updatedAt
          properties:
            _id:
              type: string
            email:
              type: string
              format: email
              description: Managed by the auth layer, change it via the auth change-email flow, not this API
            emailVerified:
              type: boolean
            roles:
              type: array
              items:
                type: string
              default: []
            createdAt:
